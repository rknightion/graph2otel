name: grafana-sync

# Keep the m7kni Grafana stack in step with this repository's generated Grafana
# artifacts. Two deliberately different delivery paths:
#
#   dashboard -> a commit into rknightion/gc-gitsync-m7kni, because that repo is a
#                Grafana GitSync source and Grafana writes UI saves back into it. A
#                direct API push would create out-of-band edits and make the repo and
#                the stack diverge with no way to tell which is right.
#   rules     -> `make rules-push`, this repository's own deployer. NOT a bare
#                `gcx resources push`: the committed manifests carry
#                `grafana.app/folder: REPLACE_WITH_FOLDER_UID`, and an unresolved token
#                fails with 403 rather than filing the rule somewhere wrong.
#
# Prune runs before push: the deployer is create-or-update only, so a rule deleted from
# the generator would otherwise keep evaluating forever.
#
# The paused portable detection pack (INCLUDE_DETECTIONS) stays out of both halves —
# those are security-content examples an operator opts into, not part of this deploy.

on:
  push:
    branches: [main]
    paths:
      - 'dashboards/**'
      - 'alerts/**'
      - 'grafana/**'
      - 'scripts/grafana-prune-rules.py'
      - '.github/workflows/grafana-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two syncs write the stack at once; never cancel one mid-write.
concurrency:
  group: grafana-sync
  cancel-in-progress: false

env:
  GCX_VERSION: '1.0.0'
  GCX_SHA256: 'c88c65958d19d83dc3a192a2a5037e08307a9c776019f24249b89f369c9c4d41'
  # Resolved to a UID at run time. A folder UID is stack-specific and this is a public
  # repository, so the title is what gets pinned here.
  RULES_FOLDER_TITLE: graph2otel

jobs:
  dashboards:
    name: publish dashboard to GitSync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The default GITHUB_TOKEN cannot write to another repository, hence the PAT.
      - name: check out the GitSync repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rknightion/gc-gitsync-m7kni
          token: ${{ secrets.GITSYNC_PAT }}
          path: gitsync

      # gitsync/graph2otel/ is its own GitSync folder ("graph2otel Dashboards"),
      # deliberately distinct from the "graph2otel" ALERTS folder the rules job writes.
      - name: copy the generated dashboard into place
        run: cp dashboards/graph2otel.json gitsync/graph2otel/graph2otel.json

      - name: commit and push
        working-directory: gitsync
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "dashboard already matches the stack source"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Sync graph2otel dashboard from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          # Grafana commits UI saves into this repo on its own, so a push can lose a
          # race with the stack. Rebase and retry rather than failing the sync.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt ${attempt}) — rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "::error::could not push the dashboard to gc-gitsync-m7kni after 3 attempts"
          exit 1

  rules:
    name: publish alert rules
    runs-on: ubuntu-latest
    env:
      GCX_CONFIG: ${{ github.workspace }}/.gcx-ci.yaml
      GRAFANA_CONTEXT: m7kni
      GRAFANA_STACK_ID: ${{ vars.GRAFANA_STACK_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install gcx
        run: |
          set -euo pipefail
          curl -fsSL -o gcx.tgz \
            "https://github.com/grafana/gcx/releases/download/v${GCX_VERSION}/gcx_${GCX_VERSION}_linux_amd64.tar.gz"
          echo "${GCX_SHA256}  gcx.tgz" | sha256sum -c -
          tar -xzf gcx.tgz gcx
          sudo install -m 0755 gcx /usr/local/bin/gcx
          rm -f gcx gcx.tgz
          gcx version

      # rules_deploy.py pins the context by NAME and refuses to run without one, so
      # env-var auth alone is not enough here — a real config file is required.
      - name: write the gcx context
        env:
          GRAFANA_SERVER: ${{ vars.GRAFANA_SERVER }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          cat > "${GCX_CONFIG}" <<EOF
          version: 1
          stacks:
            m7kni:
              grafana:
                server: ${GRAFANA_SERVER}
                token: ${GRAFANA_TOKEN}
                auth-method: token
                stack-id: ${GRAFANA_STACK_ID}
          contexts:
            m7kni:
              stack: m7kni
              datasources:
                loki: grafanacloud-logs
                prometheus: grafanacloud-prom
          current-context: m7kni
          EOF

      - name: resolve the alerts folder UID
        run: |
          set -euo pipefail
          # gcx prepends a one-line {"class":"hint",...} banner in AGENT mode only, so
          # it is filtered rather than dropped by position — a bare `tail -n +2` eats
          # the only line of real output on a CI runner.
          uid="$(gcx --context m7kni api /api/folders \
                   --jq ".[] | select(.title==\"${RULES_FOLDER_TITLE}\") | .uid" \
                 | { grep -v '^{"class"' || true; } | tr -d '"' | tail -n 1)"
          test -n "${uid}" || { echo "::error::no folder titled ${RULES_FOLDER_TITLE}"; exit 1; }
          echo "resolved ${RULES_FOLDER_TITLE} -> ${uid}"
          echo "RULES_FOLDER_UID=${uid}" >> "$GITHUB_ENV"

      # The deployable set is the deployer's own, not a filename heuristic: the
      # detection pack is excluded here exactly as `make rules-push` excludes it.
      - name: list the rules this repository deploys
        run: |
          set -euo pipefail
          python3 - > expected-rules.txt <<'PY'
          import sys
          sys.path.insert(0, "grafana")
          import rules_deploy
          for name in sorted(rules_deploy.project_all(include_detections=False)):
              print(name)
          PY
          echo "this repository deploys $(wc -l < expected-rules.txt) rules"

      - name: prune rules the repository no longer defines
        run: |
          python3 scripts/grafana-prune-rules.py \
            --context m7kni \
            --folder "${RULES_FOLDER_UID}" \
            --keep-file expected-rules.txt

      - name: push rules
        run: make rules-push GRAFANA_CONTEXT=m7kni

      # A push that reports success is not a deployment that matches source — the
      # deployer's read-back compares projected CONTENT field by field.
      - name: prove the stack matches source
        run: make rules-readback GRAFANA_CONTEXT=m7kni

      - name: remove the credential file
        if: always()
        run: rm -f "${GCX_CONFIG}"
