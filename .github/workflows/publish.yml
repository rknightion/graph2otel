# Publish the multi-arch image + Helm chart to GHCR via the shared rknightion
# container-publish reusable (native amd64+arm64 matrix, cosign signing, provenance,
# syft SPDX+CycloneDX SBOM, Trivy, OCI Helm chart publish). Called by
# release-please.yml when a release is created (release_tag set). Also
# workflow_dispatch-able: leave release_tag empty for an edge (:main) test
# build, or set it to re-publish a tag.
#
# helm-chart-path points at charts/graph2otel (#26); no charts-repo/sign/sbom
# overrides are set, matching tailscale2otel's proven usage of this same
# reusable — its defaults apply.
name: publish

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to publish, e.g. v1.2.3"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (vX.Y.Z) to publish; empty = edge (:main) test build"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: write        # SBOMs attached to the release (when release_tag set)
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: rknightion/.github/.github/workflows/container-publish.yml@0e56520d848f5fda8cbfa0bda17797ef41f2a5a7 # v1.9.8
    with:
      release-tag: ${{ inputs.release_tag }}
      dockerfile: Dockerfile
      helm-chart-path: charts/graph2otel

  # go-licenses third-party notices (Go-specific; migrates to the shared binaries
  # reusable later). Releases only. Runs `just notices` (scripts/notices.sh) — the
  # same generator the image build bakes into /licenses/ and that runs locally.
  notices:
    if: inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'
      - name: Generate third-party notices
        run: just notices
      - name: Attach third-party notices to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "${RELEASE_TAG}" THIRD_PARTY_NOTICES.md --clobber
