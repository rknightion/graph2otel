# graph2otel example configuration.
#
# This file is optional: with no -config flag graph2otel runs from its
# built-in defaults plus environment variables alone (the container-friendly
# path). Any key you omit here keeps its default; a supported G2O_ environment
# variable overrides the matching YAML scalar if both are set (env always
# wins). tenants[] and profiling.pyroscope.tags are file-only; the global
# collectors map has the dynamic env form documented below.
#
# Configuration is strict. Startup and `graph2otel check` reject unknown YAML
# keys, unknown G2O_* variables, and unknown collector names before credentials
# or network clients are constructed. Diagnostics name the exact offending
# path or environment variable without printing its value. Fixed objects are
# closed; only collector-name maps and profiling.pyroscope.tags accept dynamic
# keys.
#
# IMPORTANT — no secrets or auth material belong in this file, ever:
#   * Tenant credentials (client secret, certificate, or workload/managed
#     identity) are NEVER read from tenants[] or from any key in this file.
#     tenants[].tenant_id is the hyphenated Entra directory GUID. graph2otel sets
#     it on every token request and verifies the returned token's tid before any
#     tenant-labelled collection starts. azidentity.DefaultAzureCredential
#     selects one ambient application identity for the process from its
#     well-known environment variables or the host's workload/managed identity.
#     A managed identity works only for its home tenant; a configured mismatch
#     fails that tenant closed. tenants[].client_id is only an optional
#     non-secret consistency assertion; it never selects or overrides the
#     credential.
#   * otlp.grafana_cloud.token IS a credential and belongs in the
#     G2O_OTLP__GRAFANA_CLOUD__TOKEN environment variable instead of this
#     file. It is shown here only to document the key name.

log_level: info # debug | info | warn | error

# tenants lists every Entra tenant graph2otel polls. At least one entry is
# required unless otlp.protocol is "stdout". Set via env with
# G2O_TENANTS__<index>__<field> is NOT supported (a flat env var cannot
# express a list of structs) — use this file for tenants.
tenants:
  - tenant_id: "00000000-0000-0000-0000-000000000000" # hyphenated Entra directory GUID only
    client_id: "" # optional expected app ID; an assertion, not credential selection
    # Opt-in, default-off: drop graph2otel's OWN polling exhaust — records whose
    # appId matches the application identity proved from this tenant's Graph
    # access token. A TENANT-level flag because "self" spans transports: it drives
    # the blob feed (up to ~60% of MicrosoftGraphActivityLogs volume) AND the
    # Graph-polled entra.signins.service_principal stream (~1.1% there —
    # live-measured 2026-07-19, #176). The client_id assertion above never
    # controls the comparison: a mismatch warns once and the authenticated app
    # ID wins. If token identity cannot be proved, filtering is disabled, every
    # record is retained, and startup emits one bounded warning. Each drop
    # increments graph2otel.blob.self_excluded /
    # graph2otel.logpipeline.self_excluded, so the reduction is visible.
    # exclude_self: false
    # Optional per-tenant collector overrides. These layer on top of the global
    # `collectors` block below, winning field-by-field, so one tenant can
    # disable a collector (or retune its interval) that the rest keep enabled.
    # collectors:
    #   "entra.signins.interactive":
    #     enabled: false
    #
    # Optional read-only Azure Storage blob ingest — the ONE place graph2otel
    # reads from outside Microsoft Graph. It exists for the signals Graph has no
    # endpoint for at all (MicrosoftGraphActivityLogs, and see docs/blob-ingest.md
    # for the rest), which reach you only as Azure Monitor diagnostic-settings
    # output landing in a storage account.
    #
    # Setting account_url IS the opt-in: leave it unset (the default) and no
    # blob collectors are registered, so a deployment with no storage account is
    # completely unaffected. No credential goes here — this tenant's existing
    # AZURE_* credential is reused, and it needs the DATA-plane role
    # "Storage Blob Data Reader" on that account (Owner is NOT enough; it grants
    # container listing but not blob content reads).
    #
    # Setting account_url ALSO turns on the Defender XDR advanced-hunting
    # collectors (defender.*) — they are read-only blob ingest, on by default
    # once a storage account is configured, not a per-collector opt-in.
    # blob_ingest:
    #   account_url: "https://myaccount.blob.core.windows.net"
    #   # (self-exhaust filtering is the tenant-level exclude_self key above)
    #
    # Optional: which Office 365 Management Activity API content types the
    # m365.activity collector subscribes to. Unlike blob_ingest this is NOT an
    # opt-in to run the collector — m365.activity is default-on, because its
    # transport is stable v1.0 (unlike m365.unified_audit's beta query API).
    # This block only widens what it fetches.
    #
    # Unset (the default) subscribes to Audit.Exchange + Audit.SharePoint.
    # Valid: Audit.AzureActiveDirectory, Audit.Exchange, Audit.SharePoint,
    # Audit.General, DLP.All.
    #
    # The API has NO server-side filtering, so a content type is all-or-nothing:
    # subscribing means fetching every record it carries, and every record
    # fetched is shipped as a log (there is no record-type include-list — see
    # docs/signals.md on why per-entity rows are never fetched-then-dropped).
    #
    # Audit.General is opt-in because of that: measured on a 6-device tenant it
    # carries 4,035 records/23h, of which 3,865 are Endpoint DLP file activity,
    # 165 SecurityComplianceCenter and 3 Teams. If you want Teams admin activity
    # you fetch the whole catch-all to get it, and that ratio grows with your
    # fleet. For a SIEM that Endpoint DLP stream is a feature — per-file hashes,
    # device and user — so enable it deliberately, not by accident.
    #
    # Audit.AzureActiveDirectory is omitted from the default because
    # entra.signins.interactive and entra.directory_audits already emit those
    # records; adding it here ships them twice.
    # o365_activity:
    #   content_types: ["Audit.Exchange", "Audit.SharePoint", "Audit.General"]
    #
    # Optional: Microsoft Defender for Cloud Apps (MDCA) Cloud Discovery parse
    # health (mdca.discovery_parse). The ONE non-Graph, non-poller signal: the
    # MDCA portal API authenticates with a static "Authorization: Token" token,
    # not the Entra credential, so there is no app-registration scope to grant.
    #
    # Setting portal_url IS the opt-in: leave it unset and no MDCA collectors are
    # registered. Both fields are non-secret — a URL and a filesystem PATH — so
    # they belong in YAML; the token itself lives in the file at token_file and
    # must NEVER appear in YAML or an env var (a per-tenant secret has no env path
    # here: koanf cannot bind a value into a tenants[] slice element). Mount the
    # token as a file (k8s secret / docker secret) and point token_file at it.
    # The collector is Experimental — the MDCA portal API has no Graph successor.
    # mdca:
    #   portal_url: "https://<tenant>.<region>.portal.cloudappsecurity.com"
    #   token_file: "/run/secrets/mdca_token"

    # exchange_online enables the Defender quarantine queue-depth collector
    # (defender.quarantine). No credential of its own — the tenant's existing
    # DefaultAzureCredential is reused against the Exchange Online audience — but
    # it needs TWO grants on the service principal, and neither alone works:
    #   1. the app role Exchange.ManageAsApp on "Office 365 Exchange Online"
    #   2. an Entra DIRECTORY role, Security Reader being the least-privileged
    #      sufficient one (assigned in the Entra portal, not via scope consent)
    # Both are read-only. With only the first, every poll answers 403.
    # exchange_online:
    #   enabled: true

    # hunting enables the advanced-hunting collectors (#249) — the DeviceTvm*
    # threat-and-vulnerability-management posture (device vulnerabilities, secure
    # configuration assessments, software inventory), reached over the Graph
    # runHuntingQuery API. No credential of its own — the tenant's existing
    # DefaultAzureCredential is reused — but it needs the ThreatHunting.Read.All
    # app role (read-only); without it every query answers 403. Opt-in, and off
    # by default, because each query draws on a per-tenant CPU budget shared with
    # humans in the Defender portal, so the collectors poll on a long interval and
    # an operator turns them on deliberately. A tenant with no Defender-onboarded
    # devices sees empty results, so enabling it there is harmless but pointless.
    # hunting:
    #   enabled: true

otlp:
  protocol: http # grpc | http | stdout (stdout = print signals to the console for local debug, no backend)
  endpoint: "https://otlp-gateway-prod-us-central-0.grafana.net/otlp" # OTLP base URL (the exporter appends /v1/metrics and /v1/logs itself)
  grafana_cloud:
    instance_id: "" # Grafana Cloud OTLP instance ID
    token: "" # DO NOT set here — use G2O_OTLP__GRAFANA_CLOUD__TOKEN instead
    token_file: "" # OR read the token from a file (k8s/Docker secret mount); value XOR token, never both

# collectors overrides per-collector behavior globally (across all tenants),
# keyed by collector name. A collector omitted here runs enabled at its
# built-in default interval. `enabled` unset means "default true" (distinct from
# an explicit false); `interval` unset (or 0) means "use the collector default".
# Names must match the generated collector reference exactly; an unambiguous
# typo gets a "did you mean" suggestion. The only dynamic env form is
# G2O_COLLECTORS__<NAME>__(ENABLED|INTERVAL|SOURCE), with the collector name
# uppercased and otherwise preserved, e.g.
# G2O_COLLECTORS__ENTRA.SIGNINS.INTERACTIVE__ENABLED=false.
collectors: {}
#   "entra.signins.interactive":
#     enabled: true
#     interval: "5m"  # duration string: "30s", "5m", "168h" (minimum 1s)
#
# `source` is optional and must be exactly `graph` or `blob`. It applies only to
# the three source-switchable collectors: entra.directory_audits,
# entra.provisioning, and entra.risk_detections. Setting even `source: graph` on
# any other collector is rejected instead of being ignored.
#   "entra.directory_audits":
#     source: blob
#
# Experimental (beta / new-surface) collectors are OFF unless explicitly enabled
# here — a beta Graph change can never break a default deployment. To opt in
# (quote keys that contain dots):
#   "m365.unified_audit":       # Exchange/SharePoint/OneDrive/Teams activity as OTLP
#     enabled: true             # logs via the async Purview Audit query API. Needs
#                               # AuditLogsQuery.Read.All + Purview Audit (E3+). Coarse
#                               # interval only — the query API 429s on rapid create.
#   "purview.ediscovery_cases": # eDiscovery (Premium) case inventory: a count of cases
#     enabled: true             # by status + a log twin per case. It is v1.0 GA, NOT a
#                               # beta endpoint — it is off-by-default because it needs
#                               # TWO things a normal collector does not: (1) grant +
#                               # admin-consent eDiscovery.Read.All, AND (2) register the
#                               # app's service principal in the Security & Compliance
#                               # data plane via PowerShell — the scope alone 401s. See
#                               # docs/data-plane-registration.md for that second half,
#                               # and docs/permissions.md section 4b. Enabling it without
#                               # the registration produces a loud 401 every poll.
#
# Large-tenant tuning (10k+ users/devices). The built-in intervals are sized for
# a typical tenant; every collector's cadence is already overridable here (and
# per-tenant under tenants[].collectors), so widening a few full-collection
# pollers is a config change, not a code change. graph2otel already requests
# Graph's largest page size (Prefer: odata.maxpagesize) on every full-collection
# walk, so page counts stay ~10x lower than Graph's default — but on a very large
# tenant these three collectors do the most per-cycle work and are the ones worth
# stretching if you want to cut Graph call volume further. Keys are the full
# collector names, so quote them (they contain dots):
#   "intune.devices":          # full managedDevices fleet page-walk (default 1h)
#     interval: "3h"
#   "intune.malware":          # managedDevices walk + per-Windows-device Defender sweep (default 30m)
#     interval: "2h"
#   "entra.credential_expiry": # /applications + /servicePrincipals keyCredentials walk (default 15m)
#     interval: "1h"           # Graph throttles $select=keyCredentials tighter (~150/min per tenant); widen on a large app estate

# admin exposes operator liveness (/healthz), readiness (/readyz), and
# per-collector status. Before the readiness latch, configured tenants with
# zero working collectors or no successful run return 503. The first collector
# success latches readiness for the process lifetime: partial tenant success is
# ready while failures remain degraded, and later failures do not flap it.
# Zero-tenant stdout mode is ready immediately. Liveness is independent of
# collector outcomes, and failure to bind an enabled admin server is fatal.
# Disabled by default; bind address defaults to :9090.
admin:
  enabled: false # run the admin health/readiness/status HTTP endpoint
  addr: ":9090" # bind address for the admin endpoint
  refresh_interval: 5s # how often the status page re-polls /api/status.json (1s freshness ticker is independent)

# profiling enables optional Grafana Pyroscope continuous profiling (default
# off). It has no effect on the exporter's core job and a failure to reach
# Pyroscope is non-fatal. basic_auth_password is a credential — set it via
# G2O_PROFILING__PYROSCOPE__BASIC_AUTH_PASSWORD, never in committed YAML.
profiling:
  pyroscope:
    enabled: false # run the Pyroscope continuous-profiling push agent
    # Grafana Cloud Profiles ingest endpoint (e.g. https://profiles-prod-NNN.grafana.net).
    server_address: "" # REQUIRED when enabled, e.g. http://pyroscope:4040 or https://profiles-prod-NNN.grafana.net
    basic_auth_user: "" # Grafana Cloud Profiles user/instance ID
    basic_auth_password: "" # DO NOT set here — use the env var above
    basic_auth_password_file: "" # OR read the password from a file (k8s/Docker secret mount); value XOR basic_auth_password, never both
    tenant_id: "" # optional; leave empty for Grafana Cloud
    upload_rate: 15s # optional; 0/omit uses the pyroscope default
    tags: {} # extra static tags; service_version is always set and cannot be overridden
  # runtime mutex/block sampling; on by default. Applied only when the pyroscope
  # push is enabled, so it costs nothing when profiling is off. Set either to 0 to
  # drop that contention profile.
  mutex_profile_fraction: 5      # runtime.SetMutexProfileFraction; 0 = disabled
  block_profile_rate: 100000     # runtime.SetBlockProfileRate (ns, 100µs); 0 = disabled

# cardinality governs output-side active-series limits (Grafana Cloud bills on
# active series). Both caps are enforced by graph2otel's own limiter, which keeps
# the most SIGNIFICANT series (top-N by value) and folds the rest into a named
# `other` bucket — additive metrics get the tail summed, non-additive ones (a
# score, a ratio, a duration) have it dropped and counted, because a synthetic
# aggregate would be worse than the loss. The OTEL SDK's own per-instrument cap
# is disabled in favor of it: that one is arrival-ordered, so the survivors are
# whichever showed up first and the rest vanish into an opaque
# otel.metric.overflow. graph2otel.series.active/.clipped/.total/.limit report
# where each metric sits. The largest metric on a live tenant measures 175
# series, so these are blast-radius guards, not normal constraints. 0 = unlimited
# on either axis — the escape hatch for self-hosted Prometheus/Mimir.
# Env: G2O_CARDINALITY__PER_METRIC_LIMIT, G2O_CARDINALITY__GLOBAL_LIMIT.
cardinality:
  per_metric_limit: 5000 # per-metric active-series cap; beyond it the top series by value are kept and the tail folds into `other` (0 = unlimited)
  global_limit: 100000 # total active-series cap across every metric; overage is absorbed by the worst offenders via max-min fairness (0 = unlimited)

# cost enables observational cost projections from operator-supplied integer
# microunit rates. graph2otel ships NO vendor prices: currency, schedule
# identity/provenance, effective time, and all four rates are required when
# enabled. An explicit zero rate is valid and differs from an omitted rate.
# Budget 0 disables the comparison; it never drops or suppresses telemetry.
cost:
  enabled: false # opt in to cost accounting; default off
  currency: "" # uppercase 3-letter currency code, required when enabled
  version: "" # nonblank operator rate-schedule version, required when enabled
  source: "" # nonblank operator rate source/provenance, required when enabled
  effective_at: "" # RFC3339 rate-schedule effective timestamp, required when enabled
  period: 720h # positive projection period; 720h = 30 days
  rates:
    source_record_microunits: null # microunits per logical source record; explicit nonnegative integer required when enabled
    metric_point_microunits: null # microunits per emitted metric point; explicit nonnegative integer required when enabled
    log_record_microunits: null # microunits per emitted log record; explicit nonnegative integer required when enabled
    transmitted_payload_byte_microunits: null # microunits per post-compression OTLP payload byte; explicit nonnegative integer required when enabled
  budget_microunits: 0 # nonnegative projection-period budget; 0 disables comparison

# backfill tunes how much history a window (log) collector recovers on a COLD
# START — no checkpoint yet: a new tenant, a wiped volume, a first deploy. It does
# NOT affect the steady state: once a checkpoint exists, polling resumes from the
# watermark and a long gap is walked forward in capped chunks, losslessly. Snapshot
# (metric) collectors are unaffected — they re-derive their whole state every tick,
# so there is no history for them to recover.
#
# 0 (the default) means "use each collector's own built-in lookback", which is not
# one value: most streams use 1h, m365.unified_audit 4h, entra.security_incidents
# 24h — tuned per endpoint's data latency and throttling ceiling. A non-zero value
# replaces ALL of them, so set it for a deliberate recovery rather than as a
# permanent default.
#
# GRAFANA CLOUD CEILING — live-measured 2026-07-22 (#226): its OTLP gateway
# strictly rejects entries older than 7 days. Rejection is explicit and per-entry
# (HTTP 400 through the OTel error handler); in-window entries in the same batch
# remain accepted. Accepted in-window backdated records can be indexed later, so
# an immediately empty query is not evidence of rejection. This value is not clamped
# because a self-hosted Loki or non-Loki OTLP sink may accept more.
# Env: G2O_BACKFILL__INITIAL_LOOKBACK.
backfill:
  initial_lookback: 0s # cold-start backfill window; 0 = each collector's own built-in lookback

# checkpoint_dir is where window-log collectors persist their per-(tenant,
# endpoint) watermarks so a restart resumes rather than re-fetching or dropping.
# It MUST be writable and persistent: without it every restart re-polls each
# collector's whole initial-lookback window (a burst of duplicate log records in
# the backend), and an outage longer than that lookback silently drops the events
# in between. graph2otel fails fast at startup if it is unwritable (#117).
# In a container this relative default cannot work — the image is read-only —
# so override it to an absolute path on a mounted volume (see docker-compose.yml,
# which sets G2O_CHECKPOINT_DIR=/var/lib/graph2otel against a bind mount owned by
# uid 65532; the Helm chart sets it to /var/lib/graph2otel/checkpoints).
checkpoint_dir: "./checkpoints" # root dir for the file-based CheckpointStore
