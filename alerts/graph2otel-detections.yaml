            queryType: "range"
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: "A"
              datasource:
                type: "loki"
                uid: "grafanacloud-logs"
              expr: "sum (count_over_time({service_name=\"graph2otel\"} | event_name=`entra.security_alert` | severity=~`(?i)(high|medium)` | status=~`(?i)(new|inProgress)` [5m]))"
              queryType: "range"
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            relativeTimeRange:
