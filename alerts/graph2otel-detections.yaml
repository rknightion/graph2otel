      - uid: "g2o-detect-interactive-signin-anomaly"
        title: "Interactive sign-in blocked by Conditional Access or flagged at risk"
        condition: "C"
        data:
          - refId: "A"
            datasourceUid: "grafanacloud-logs"
            queryType: "range"
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: "A"
              datasource:
                type: "loki"
                uid: "grafanacloud-logs"
              expr: "(sum (count_over_time({service_name=\"graph2otel\"} | event_name=`entra.signin` | sign_in_event_types=`interactiveUser` | conditional_access_status=`failure` [5m]))) + (sum (count_over_time({service_name=\"graph2otel\"} | event_name=`entra.signin` | sign_in_event_types=`interactiveUser` | risk_state=~`atRisk|confirmedCompromised` [5m])))"
              queryType: "range"
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              reducer: "last"
              type: "reduce"
              refId: "B"
          - refId: "C"
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
