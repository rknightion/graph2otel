      - uid: "g2o-detect-graph-403-burst"
        title: "Graph API authorization-denial burst from a single application"
        condition: "C"
        data:
          - refId: "A"
            datasourceUid: "grafanacloud-logs"
            queryType: "range"
            relativeTimeRange:
