          description: "Incidents are the CORRELATION layer above individual alerts: one incident groups related alerts Microsoft believes are the same attack. This therefore OVERLAPS with the unresolved-alert detection above, and a single security event will usually match both. That is deliberate, since the incident carries the correlation and the alert carries the detail, but decide which one you want to page on rather than enabling both and being paged twice for one event."
          tuning_required: "Enable this or the alert rule, not both, until you have watched a real incident arrive and seen which gives your responders the better entry point."
          runbook_url: "https://m7kni.io/graph2otel/runbooks/#g2o-detect-security-incident-active"
