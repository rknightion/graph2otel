              datasource:
                type: "loki"
                uid: "grafanacloud-logs"
              expr: "sum by (app_id) (count_over_time({service_name=\"graph2otel\"} | event_name=`entra.graph_activity` | response_status_code=`403` [5m]))"
              queryType: "range"
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            relativeTimeRange:
              from: 0
