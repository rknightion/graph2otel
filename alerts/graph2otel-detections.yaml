          source: "entra"
          category: "identity-threat"
          pipeline: "graph2otel"
        annotations:
          summary: "An interactive sign-in was CA-blocked or risk-flagged"
          description: "A real user sign-in that Conditional Access blocked, or that Entra ID Protection scored atRisk or confirmedCompromised. Check user_principal_name, app_display_name and ip_address on the record. The tenant this came from adds a third clause for sign-ins outside its expected country; that is a per-tenant policy statement rather than a portable default, so it is not shipped. Add another OR term filtering location_country_or_region against your own country code if you want it."
          tuning_required: "Conditional Access failures include ordinary events such as a user declining an MFA prompt, so on most tenants this needs either a threshold above zero or a narrowing to risk_state alone. Measure your CA failure rate over 30 days first. Risk states require Entra ID P2."
          runbook_url: "https://m7kni.io/graph2otel/runbooks/#g2o-detect-interactive-signin-anomaly"
          __dashboardUid__: "graph2otel"
          __panelId__: "86"
          dashboard_path: "/d/graph2otel?dtab=Entra&viewPanel=86"
