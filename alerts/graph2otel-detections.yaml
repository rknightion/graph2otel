# GENERATED by grafana/build_rules.py — do not edit by hand.
# Edit the DETECTIONS list there, then run `make rules`.
#
# PORTABLE DETECTION EXAMPLES — EVERY RULE HERE IS PAUSED ON PURPOSE.
#
# These are worked examples of querying graph2otel's log signals for security
# outcomes, adapted from detections running on a real tenant. They are NOT
# graph2otel health monitoring; that is alerts/graph2otel-alerts.yaml, which is a
# separate file and folder precisely so the two are never confused.
#
# None of these thresholds has been measured on more than one tenant. Each rule
# carries a `tuning_required` annotation naming the measurement it needs before
# it is safe to enable. Un-pause a rule only after you have made that
# measurement on YOUR tenant — an alert that fires on correct data is worse than
# no alert, because it teaches responders to ignore the channel.
#
# They contain no tenant identifier, application id, network address or
# geography. Substituting your own is expected for some of them; the
# descriptions say where.
#
# Log attributes are Loki STRUCTURED METADATA, not stream labels. Only
# service_name is a stream label, which is why every query below starts
# {service_name="graph2otel"} and filters after the pipe. A stream selector on
# an attribute matches zero rows silently — see docs/signals.md.
apiVersion: 1
groups:
  - orgId: 1
    name: "graph2otel-detections"
    folder: "graph2otel detections"
    interval: "5m"
    rules:
      - uid: "g2o-detect-privileged-directory-change"
        title: "Privileged directory change (app credential, role, consent, CA or owner)"
        condition: "C"
        data:
          - refId: "A"
            datasourceUid: "grafanacloud-logs"
            queryType: "range"
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: "A"
              datasource:
                type: "loki"
                uid: "grafanacloud-logs"
              expr: "sum (count_over_time({service_name=\"graph2otel\"} | event_name=`entra.directory_audit` | activity_display_name=~`(?i)(consent to application|add app role assignment.*|add delegated permission grant|add service principal.*|add application.*|.*certificates and secrets management.*|add member to role.*|add owner to .*|.*conditional access polic.*)` [5m]))"
              queryType: "range"
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              reducer: "last"
              type: "reduce"
              refId: "B"
          - refId: "C"
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "B"
              type: "threshold"
              conditions:
                - type: "query"
                  evaluator:
                    type: "gt"
                    params:
                      - 0
                  operator:
                    type: "and"
                  query:
                    params:
                      - "C"
                  reducer:
                    type: "last"
                    params: []
              refId: "C"
        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        labels:
          severity: "critical"
          source: "entra"
          category: "identity-threat"
          pipeline: "graph2otel"
        annotations:
          summary: "A high-risk Entra directory change was recorded"
          description: "An entra.directory_audit activity matched the high-risk set: application credential or secret added, admin consent granted, app role or delegated permission granted, service principal or application created, directory role member added, owner added, or a Conditional Access policy changed. Each is a step an attacker takes to establish persistence, and each is also ordinary administrative work, so this fires on legitimate changes too by design. Inspect initiated_by and target_resources on the record. The activity list is the valuable part of this rule: it is tenant independent and tedious to reconstruct."
          tuning_required: "Fires on your own admin work. Run the query over 30 days to learn your tenant's normal change rate, then decide whether to route it to a review queue rather than a pager, or to exclude specific initiators."
          runbook_url: "https://m7kni.io/graph2otel/runbooks/#g2o-detect-privileged-directory-change"
          __dashboardUid__: "graph2otel"
          __panelId__: "91"
          dashboard_path: "/d/graph2otel?dtab=Entra&viewPanel=91"
        isPaused: true
      - uid: "g2o-detect-security-alert-unresolved"
        title: "Security alert, medium or high, still unresolved"
        condition: "C"
        data:
