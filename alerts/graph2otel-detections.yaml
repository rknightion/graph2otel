          description: "A burst of authorization denials from a single caller can indicate permission probing or a compromised identity exploring what it can reach. It is equally often an application that lost a consent grant, which is worth knowing either way. Check app_id and the denied paths."
          tuning_required: "Needs entra.graph_activity, which arrives over blob ingest. The threshold of 10 in 5 minutes is a starting point from one small tenant; a tenant with more automation will need a higher one. Measure your own per-app 403 baseline before enabling."
          runbook_url: "https://m7kni.io/graph2otel/runbooks/#g2o-detect-graph-403-burst"
          __dashboardUid__: "graph2otel"
          __panelId__: "81"
          dashboard_path: "/d/graph2otel?dtab=Entra&viewPanel=81"
