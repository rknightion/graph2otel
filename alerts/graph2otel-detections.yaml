        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        labels:
          severity: "critical"
          source: "entra"
          category: "identity-threat"
          pipeline: "graph2otel"
        annotations:
          summary: "An unresolved medium/high security alert is open"
          description: "The entra.security_alert stream carries alerts from ALL Microsoft sources that surface through the security API: Defender for Endpoint, Defender for Cloud Apps and Entra ID Protection all arrive here, so one rule covers products that are separate consoles in the portal. Inspect title, category and service_source to see which product raised it."
          tuning_required: "Volume depends entirely on your Defender licensing and tenant size. Measure the alert rate over 30 days before enabling; on a noisy tenant raise the threshold or narrow to severity=high."
          runbook_url: "https://m7kni.io/graph2otel/runbooks/#g2o-detect-security-alert-unresolved"
          __dashboardUid__: "graph2otel"
          __panelId__: "263"
          dashboard_path: "/d/graph2otel?dtab=Defender&viewPanel=263"
        isPaused: true
      - uid: "g2o-detect-security-incident-active"
        title: "Security incident, medium or high, active"
        condition: "C"
        data:
          - refId: "A"
            datasourceUid: "grafanacloud-logs"
