          description: "mdca_discovery_parse_last_success_age_seconds for input_stream_id={{ $labels.input_stream_id }}, tenant {{ $labels.tenant_id }} has exceeded 10800s (3h) for 15m. This is the alert-on-SILENCE signal a failure counter cannot produce: a dead uploader emits no failed parse tasks, so g2o-mdca-parse-failing stays green while data silently stops. Replace 10800 with ~3x YOUR upload cadence in seconds. noDataState is OK because a tenant with no Cloud Discovery streams legitimately emits no series; once a stream has parsed once, the gauge is always present and keeps climbing when uploads stop."
