  annotations:
    summary: "An interactive sign-in was CA-blocked or risk-flagged"
    description: "A real user sign-in that Conditional Access refused, or that Entra ID Protection scored atRisk or confirmedCompromised. Check user_principal_name, app_display_name, status_error_code and ip_address on the record, then read appliedConditionalAccessPolicies on the sign-in in Entra to see WHICH policy returned failure — graph2otel does not export that field, and without it a CA failure names no policy. Error 50097 is excluded by default; the tuning note explains why and when to put it back. The tenant this came from adds a third clause for sign-ins outside its expected country; that is a per-tenant policy statement rather than a portable default, so it is not shipped. Add another OR term filtering location_country_or_region against your own country code if you want it — and guard it with a presence check (location_country_or_region != \"\") as well, because Loki reads a missing label as the empty string and a bare != would fire on records that carry no location rather than on foreign ones."
    tuning_required: "Two measurements, and one exclusion already made for you. Error 50097 'Device authentication is required' is excluded from the CA limb by default because it is usually not a refusal at all: a REPORT-ONLY Conditional Access policy is still evaluated, and a report-only grant that the device cannot satisfy makes Entra stamp conditional_access_status=failure with 50097 on a sign-in nothing blocked. Measured on a live tenant 2026-08-10: all 6 interactive 50097 records in 30 days had every ENFORCED policy returning success, the only non-success entry a report-only compliant-device grant, and a success record under the SAME correlation_id about one second later. Since report-only is the documented way to stage a CA policy, any tenant rolling one out produces this. PUT 50097 BACK if your tenant ENFORCES a compliant-device or hybrid-join grant: there a 50097 with no following success is a real block, and Loki cannot join the two records on correlation_id to tell the two apart — that join is why this is a default rather than a proof. Then measure what remains: CA failures include ordinary events such as a user declining or fumbling an MFA prompt, so most tenants still need a threshold above zero or a narrowing to risk_state alone. Run the sign-in error-code hunt for both numbers — it uses a 14-day window because a 30-day count_over_time exceeds the max query range on at least one Grafana Cloud Loki stack and returns EMPTY rather than erroring, so scale what you measure rather than widening the query blind. Risk states require Entra ID P2."
    runbook_url: "https://m7kni.io/graph2otel/runbooks/#g2o-detect-interactive-signin-anomaly"
    __dashboardUid__: "graph2otel"
    __panelId__: "120"
    dashboard_path: "/d/graph2otel?dtab=Entra&viewPanel=120"
  expressions:
    A:
      model:
        refId: "A"
        datasource:
          type: "loki"
          uid: "grafanacloud-logs"
        expr: "(sum (count_over_time({service_name=\"graph2otel\"} | event_name=`entra.signin` | sign_in_event_types=`interactiveUser` | conditional_access_status=`failure` | status_error_code!=`50097` [5m]))) + (sum (count_over_time({service_name=\"graph2otel\"} | event_name=`entra.signin` | sign_in_event_types=`interactiveUser` | risk_state=~`atRisk|confirmedCompromised` [5m])))"
        queryType: "range"
