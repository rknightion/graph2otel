spec:
  title: "Interactive sign-in blocked by Conditional Access or flagged at risk"
  paused: true
  noDataState: "Ok"
  execErrState: "Error"
  trigger:
    interval: "5m"
  labels:
    severity: "critical"
    source: "entra"
